<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1250" viewBox="0 0 1640 1250"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1 1 L9 4 L1 7" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1640" height="1250" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="50" y="52" font-size="32" text-anchor="start" font-weight="bold">Facade — sequência de conclusão</text><text x="50" y="85" font-size="19" text-anchor="start" font-weight="normal">Proposta independente • caminho de sucesso e reenvio da mesma ocorrência</text><rect x="25" y="120" width="250" height="52" rx="3" fill="#e2e8f0" stroke="#64748b"/><text x="150" y="153" font-size="21" text-anchor="middle" font-weight="bold">ClienteDemo</text><path d="M150 172 L150 1130" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><rect x="355" y="120" width="250" height="52" rx="3" fill="#dbeafe" stroke="#64748b"/><text x="480" y="153" font-size="21" text-anchor="middle" font-weight="bold">JogoFacade</text><path d="M480 172 L480 1130" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><rect x="675" y="120" width="250" height="52" rx="3" fill="#e2e8f0" stroke="#64748b"/><text x="800" y="153" font-size="21" text-anchor="middle" font-weight="bold">PetVirtual</text><path d="M800 172 L800 1130" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><rect x="975" y="120" width="250" height="52" rx="3" fill="#e2e8f0" stroke="#64748b"/><text x="1100" y="153" font-size="21" text-anchor="middle" font-weight="bold">HistoricoUsuario</text><path d="M1100 172 L1100 1130" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><rect x="1305" y="120" width="250" height="52" rx="3" fill="#e2e8f0" stroke="#64748b"/><text x="1430" y="153" font-size="21" text-anchor="middle" font-weight="bold">Conquista</text><path d="M1430 172 L1430 1130" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><text x="50" y="210" font-size="18" text-anchor="start" font-weight="normal">Precondição: atividade concluída; categoria e XP calculados e validados.</text><path d="M150 265 L480 265" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="315.0" y="255" font-size="17" text-anchor="middle" font-weight="normal">1. concluirAtividade(idConclusao, categoria, pontos)</text><path d="M480 315 L1100 315" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="790.0" y="305" font-size="17" text-anchor="middle" font-weight="normal">2. possuiConclusao(idConclusao)</text><path d="M1100 365 L480 365" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="790.0" y="355" font-size="17" text-anchor="middle" font-weight="normal">3. registrada</text><rect x="40" y="390" width="1560" height="690" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="40" y="390" width="90" height="30" fill="#e2e8f0" stroke="#64748b"/><text x="52" y="412" font-size="17" text-anchor="start" font-weight="bold">alt</text><text x="155" y="415" font-size="18" text-anchor="start" font-weight="bold">[conclusão já registrada]</text><path d="M480 460 L150 460" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="315.0" y="450" font-size="17" text-anchor="middle" font-weight="normal">4. ResultadoConclusao(JA_REGISTRADA)</text><path d="M40 490 L1600 490" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><text x="155" y="519" font-size="18" text-anchor="start" font-weight="bold">[nova conclusão]</text><path d="M480 565 L800 565" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="640.0" y="555" font-size="17" text-anchor="middle" font-weight="normal">5. adicionarXP(categoria, pontos)</text><path d="M480 620 L800 620" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="640.0" y="610" font-size="17" text-anchor="middle" font-weight="normal">6. verificarEvolucao()</text><path d="M480 675 L1100 675" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="790.0" y="665" font-size="17" text-anchor="middle" font-weight="normal">7. registrarConclusao(idConclusao, categoria, pontos)</text><rect x="420" y="705" width="1140" height="290" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="420" y="705" width="90" height="30" fill="#e2e8f0" stroke="#64748b"/><text x="432" y="727" font-size="17" text-anchor="start" font-weight="bold">loop</text><text x="530" y="730" font-size="18" text-anchor="start" font-weight="bold">[para cada conquista ainda bloqueada]</text><path d="M480 775 L1430 775" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="955.0" y="765" font-size="17" text-anchor="middle" font-weight="normal">8. validarRequisitoGeral(usuario)</text><path d="M1430 825 L480 825" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="955.0" y="815" font-size="17" text-anchor="middle" font-weight="normal">9. criterioAtendido</text><rect x="435" y="850" width="1110" height="125" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="435" y="850" width="90" height="30" fill="#e2e8f0" stroke="#64748b"/><text x="447" y="872" font-size="17" text-anchor="start" font-weight="bold">opt</text><text x="550" y="875" font-size="18" text-anchor="start" font-weight="bold">[critério atendido]</text><path d="M480 930 L1430 930" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#a)"/><text x="955.0" y="920" font-size="17" text-anchor="middle" font-weight="normal">10. desbloquearConquista()</text><path d="M480 1045 L150 1045" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="315.0" y="1035" font-size="17" text-anchor="middle" font-weight="normal">11. ResultadoConclusao(PROCESSADA, novasConquistas)</text><text x="50" y="1175" font-size="17" text-anchor="start" font-weight="normal">Legenda: linha contínua com seta = chamada; linha tracejada com seta = retorno; alt = alternativa; loop = repetição; opt = condição.</text><text x="50" y="1212" font-size="17" text-anchor="start" font-weight="normal">Fonte: Guilherme Negreiros Pereira, a partir do diagrama de classes. IA como ferramenta de apoio. Exemplo síncrono.</text></g></svg>