e XP calculados e validados. Objetos pertencem ao mesmo usuário.</text><text x="55" y="958" font-size="18" font-weight="normal" text-anchor="start" fill="#172033">Proposta nova: operações de consulta e registro de conclusão em HistoricoUsuario. Demais classes: recorte da Entrega 02.</text><text x="55" y="1005" font-size="17" font-weight="normal" text-anchor="start" fill="#475569">Fonte: Guilherme Negreiros Pereira. Base: Entrega 02, Serrano e Figueiredo (seção 5.10). IA como ferramenta de apoio.</text></g></svg>